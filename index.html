<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTimer PiP - Time.is</title>
    <link rel="icon" href="timer.png" type="image/png" />
    <style>
      :root {
        --bg-color: #0f172a;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --muted-color: #94a3b8;
        --font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-family);
        overflow: hidden;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 2rem;
        font-weight: 300;
        opacity: 0.9;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .clock-icon {
        width: 32px;
        height: 32px;
        stroke: var(--accent-color);
      }

      #clock-display {
        font-size: 5rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -2px;
        margin-bottom: 1rem;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        min-width: 8ch;
      }

      #time_is_link {
        display: inline-block;
        margin-bottom: 2rem;
        color: var(--muted-color);
        font-size: 0.95rem;
        text-decoration: none;
      }

      #time_is_link:hover {
        color: var(--text-color);
        text-decoration: underline;
      }

      .btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 1rem 2rem;
        border-radius: 999px;
        color: white;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .btn:active { transform: translateY(0); }

      #pip-canvas {
        position: absolute;
        top: -9999px;
        left: -9999px;
        pointer-events: none;
      }

      #pip-video {
        position: absolute;
        width: 0;
        height: 0;
        opacity: 0;
        pointer-events: none;
      }

      .status {
        min-height: 1.2em;
        margin-top: 1rem;
        font-size: 0.9rem;
        color: var(--muted-color);
      }
    </style>
  </head>

  <body>
    <h1>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="clock-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
      KTimer
    </h1>

    <!-- Time.is owns the displayed time. -->
    <!-- Hidden Time.is-owned output. We keep this element for the official widget,
         then mirror its callback to the visible clock with a tiny paint-phase delay. -->
    <span id="_z418" aria-live="off" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden">Loading...</span>
    <div id="clock-display" aria-live="off">--:--:--</div>

    <!-- Required visible attribution/back-link for the Time.is widget. -->
    <a
      href="https://time.is/V%C4%A9nh_Long,_Vinh_Long"
      id="time_is_link"
      rel="nofollow"
      target="_blank"
    >Thời gian ở Vĩnh Long · Time.is</a>

    <button id="pip-btn" class="btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
        <path d="M7 7h10 M7 12h10 M7 17h10" />
      </svg>
      Bật Đồng Hồ PiP
    </button>

    <div id="status-text" class="status">Đang lấy giờ trực tiếp từ Time.is...</div>

    <canvas id="pip-canvas" width="1920" height="750"></canvas>
    <video id="pip-video" autoplay playsinline></video>

    <script>
      const timeIsSource = document.getElementById("_z418");
      const clockDisplay = document.getElementById("clock-display");
      const pipBtn = document.getElementById("pip-btn");
      const statusText = document.getElementById("status-text");
      const canvas = document.getElementById("pip-canvas");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("pip-video");

      let canvasStreamTrack = null;
      let lastTimeIsValue = "";
      let displayDelayTimer = null;

      // Time.is and time.is itself can cross the second boundary on different browser
      // paint frames. A small intentional delay avoids KTimer visibly flipping early.
      // If needed, tune this between ~20 and 100 ms on your own machine/network.
      const DISPLAY_ALIGNMENT_DELAY_MS = 50;

      function extractTimeIsClock(value) {
        // Time.is may pass the rendered template URL-encoded (for example "%3Cspan...").
        // Decode it first, then strip any HTML and keep only HH:MM:SS.
        let decoded = String(value ?? "");

        // Decode at most twice so both single- and double-encoded payloads are handled,
        // without getting stuck on malformed percent sequences.
        for (let i = 0; i < 2; i++) {
          try {
            const next = decodeURIComponent(decoded);
            if (next === decoded) break;
            decoded = next;
          } catch {
            break;
          }
        }

        const holder = document.createElement("div");
        holder.innerHTML = decoded;
        const plainText = (holder.textContent || holder.innerText || "")
          .replace(/\u00a0/g, " ")
          .trim();

        // Only accept a valid 24-hour clock value. This prevents encoded HTML,
        // URLs, titles, etc. from ever being shown in the KTimer display/PiP.
        const match = plainText.match(/(?:^|\D)((?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d)(?:\D|$)/);
        return match ? match[1] : "";
      }

      function drawToCanvas(text) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f8fafc";
        ctx.font = 'bold 450px "Inter", system-ui, sans-serif';
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        ctx.fillText(text || "--:--:--", canvas.width / 2, canvas.height / 2);

        canvasStreamTrack?.requestFrame?.();
      }

      // Official Time.is advanced-widget callback.
      // The value received here is the same rendered TIME string used by the widget.
      window.ktimerTimeIsTick = function (renderedValue) {
        const timeText = extractTimeIsClock(renderedValue);
        if (!timeText) return;

        clearTimeout(displayDelayTimer);
        displayDelayTimer = setTimeout(() => {
          // Paint on the next frame after the alignment delay so DOM and PiP switch together.
          requestAnimationFrame(() => {
            lastTimeIsValue = timeText;
            clockDisplay.textContent = timeText;
            drawToCanvas(timeText);
          });
        }, DISPLAY_ALIGNMENT_DELAY_MS);

        if (statusText.textContent) {
          statusText.textContent = "Nguồn thời gian: Time.is · Vĩnh Long";
          setTimeout(() => {
            if (statusText.textContent.startsWith("Nguồn thời gian:")) {
              statusText.textContent = "";
            }
          }, 2500);
        }
      };

      async function startPip() {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
          return;
        }

        try {
          if (!document.pictureInPictureEnabled || !video.requestPictureInPicture) {
            throw new Error("Trình duyệt này không hỗ trợ Picture-in-Picture API cho video.");
          }

          drawToCanvas(lastTimeIsValue || clockDisplay.textContent.trim() || "--:--:--");

          if (!video.srcObject) {
            const stream = canvas.captureStream(0);
            canvasStreamTrack = stream.getVideoTracks()[0] || null;
            video.srcObject = stream;
          }

          video.muted = false;
          video.volume = 1.0;
          await video.play();

          if ("mediaSession" in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: "Đồng hồ KTimer",
              artist: "Time.is · Vĩnh Long",
              album: "Picture-in-Picture",
            });
            navigator.mediaSession.playbackState = "playing";
          }

          await video.requestPictureInPicture();
        } catch (err) {
          console.error("PiP Error:", err);
          statusText.textContent = `Lỗi PiP: ${err.message}`;
        }
      }

      pipBtn.addEventListener("click", startPip);
      drawToCanvas("--:--:--");
    </script>

    <!-- Explicit HTTPS is intentional so the widget also works when this HTML is opened locally. -->
    <script src="https://widget.time.is/t.js"></script>
    <script>
      time_is_widget.init({
        _z418: {
          id: "Vĩnh_Long__Vinh_Long_z418",
          template: "TIME",
          time_format: "hours:minutes:seconds",
          callback: "ktimerTimeIsTick",
        },
      });
    </script>
  </body>
</html>
